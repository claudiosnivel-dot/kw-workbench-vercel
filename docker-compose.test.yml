# Postgres usato solo dai test (credenziali locali, mai reali).
# Avvio: docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kw_workbench_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kw_workbench_test"]
      interval: 2s
      timeout: 3s
      retries: 15
