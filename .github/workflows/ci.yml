# CI di Seo God Mode (T-110): nessun segreto, nessun database remoto, nessun deploy.
# Ogni azione è fissata allo SHA di commit completo; la versione è nel commento.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    # Passi di preparazione definiti qui una volta e riusati dagli altri job con ancore YAML.
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 da .nvmrc, come engines.node e il build Vercel (T-407).
          node-version-file: .nvmrc
          cache: npm
      - &npm-ci
        run: npm ci
      - &prisma-generate
        run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:component
      - run: npm run test:tooling

  integration:
    runs-on: ubuntu-latest
    # Postgres di test locale, condiviso con e2e tramite ancore YAML.
    env: &test-db-env
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54329/kw_workbench_test
    services: &test-db-services
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kw_workbench_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kw_workbench_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - *checkout
      - *setup-node
      - *npm-ci
      - *prisma-generate
      # Il global setup applica le migrazioni solo dopo assertLocalTestDatabase.
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    env: *test-db-env
    services: *test-db-services
    steps:
      - *checkout
      - *setup-node
      - *npm-ci
      - *prisma-generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Solo il report di Playwright e solo in caso di fallimento: mai .trueline/.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kw_workbench_build
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kw_workbench_build
    steps:
      - *checkout
      - *setup-node
      - *npm-ci
      - *prisma-generate
      # Env fittizie generate a ogni run: 48 caratteri casuali, mai valori reali.
      - name: Genera env fittizie
        run: |
          echo "APP_SESSION_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "APP_ENCRYPTION_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm run build
